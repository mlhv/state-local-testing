<html>
<body>

       data-iv-control="body_x_tabc_rfp_ext_prxrfp_ext_x_lblRound"
       data-iv-control-type-name="rawDataField"
       data-iv-role="field"
       data-iv-updatepanelcontrol-postback="true">
    <h3 id="body_x_tabc_rfp_ext_prxrfp_ext_x_lblRound_label">
      <span class="label-field" data-iv-role="label">Round #</span>
      <span class="tooltip-field" data-iv-role="toolTip" tabindex="0">
        <i class="fa-info-circle regular iv-tooltip icon" aria-hidden="true"></i>
        <span class="sr-only">Rounds are used to issue amendments.</span>
      </span>
    </h3>
    <div class="control-wrapper" data-iv-role="controlWrapper">
      <span class="readonly" data-iv-role="control"
            id="body_x_tabc_rfp_ext_prxrfp_ext_x_lblRound">1</span>
    </div>
  </div>

  <!-- Begin field -->
  <div class="field readonly iv-top-label iv-datetime-type iv-rawdatafield"
       data-iv-control="body_x_tabc_rfp_ext_prxrfp_ext_x_lblBeginDate"
       data-iv-control-type-name="rawDataField"
       data-iv-role="field"
       data-iv-updatepanelcontrol-postback="true">

      <span class="label-field" data-iv-role="label">Begin</span>
    </h3>
    <div class="control-wrapper" data-iv-role="controlWrapper">
      <span class="readonly" data-iv-role="control"
            id="body_x_tabc_rfp_ext_prxrfp_ext_x_lblBeginDate">5/29/2026 4:44:49 PM (CST)</span>
    </div>
  </div>

  <!-- Summary field -->
  <div class="field readonly iv-top-label iv-html-type iv-rawdatafield"
       data-iv-control="body_x_tabc_rfp_ext_prxrfp_ext_x_lblSummary"
       data-iv-control-type-name="rawDataField"
       data-iv-role="field"
       data-iv-updatepanelcontrol-postback="true">
    <h3 id="body_x_tabc_rfp_ext_prxrfp_ext_x_lblSummary_label">
      <span class="label-field" data-iv-role="label">Summary</span>
    </h3>
    <div class="control-wrapper" data-iv-role="controlWrapper">
      <div class="readonly" data-iv-role="control"
           id="body_x_tabc_rfp_ext_prxrfp_ext_x_lblSummary">
        <p><span style="font-size: 12pt">Vendor to Troubleshoot/Repair the door leading from office area to the shop.</span></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
